<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyager AI - Mission Control Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111827;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(34, 211, 238, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: #e5e7eb;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            z-index: 10;
        }

        .globe {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4a90e2 0%, #357abd 50%, #1e3a8a 100%);
            background-image: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 50%),
                linear-gradient(45deg, transparent 30%, rgba(0,100,0,0.4) 35%, rgba(0,150,0,0.6) 40%, transparent 45%),
                linear-gradient(135deg, transparent 20%, rgba(139,69,19,0.5) 25%, rgba(160,82,45,0.7) 30%, transparent 35%),
                linear-gradient(225deg, transparent 60%, rgba(0,100,0,0.5) 65%, rgba(0,120,0,0.7) 70%, transparent 75%);
            position: relative;
            top: 50px;
            left: 50px;
            animation: rotate 10s linear infinite;
            box-shadow: 
                inset -30px -30px 50px rgba(0,0,0,0.4),
                0 0 80px rgba(74, 144, 226, 0.6),
                0 0 120px rgba(74, 144, 226, 0.4);
        }

        .globe::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255,255,255,0.1) 0deg,
                transparent 90deg,
                rgba(255,255,255,0.05) 180deg,
                transparent 270deg
            );
            animation: rotate 20s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .flight-path {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            top: 50px;
            left: 50px;
        }

        .flight-path::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border: 3px dashed rgba(255, 215, 0, 0.8);
            border-radius: 50%;
            top: -10px;
            left: -10px;
            animation: dash 3s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20px;
            }
        }

        .plane {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff6b35;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            top: 35px;
            left: 135px;
            transform-origin: center;
            animation: fly 4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.8));
        }

        .plane::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.8) 50%, transparent 100%);
            top: 20px;
            left: -100px;
            border-radius: 2px;
            animation: trail 4s ease-in-out infinite;
        }

        @keyframes fly {
            0% {
                transform: rotate(0deg) translateX(150px) rotate(0deg);
            }
            25% {
                transform: rotate(90deg) translateX(150px) rotate(-90deg);
            }
            50% {
                transform: rotate(180deg) translateX(150px) rotate(-180deg);
            }
            75% {
                transform: rotate(270deg) translateX(150px) rotate(-270deg);
            }
            100% {
                transform: rotate(360deg) translateX(150px) rotate(-360deg);
            }
        }

        @keyframes trail {
            0%, 100% {
                opacity: 1;
                width: 80px;
            }
            50% {
                opacity: 0.6;
                width: 120px;
            }
        }

        .india-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff4757;
            border-radius: 50%;
            top: 180px;
            left: 220px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
        }

        .india-marker::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 71, 87, 0.6);
            border-radius: 50%;
            top: -4px;
            left: -4px;
            animation: ripple 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .loading-text {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .loading-text .dots {
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 40px rgba(74, 144, 226, 0.6);
            }
        }

        @keyframes dots {
            0%, 20% {
                color: rgba(255,255,255,0);
                text-shadow: .25em 0 0 rgba(255,255,255,0), .5em 0 0 rgba(255,255,255,0), .75em 0 0 rgba(255,255,255,0);
            }
            40% {
                color: white;
                text-shadow: .25em 0 0 rgba(255,255,255,0), .5em 0 0 rgba(255,255,255,0), .75em 0 0 rgba(255,255,255,0);
            }
            60% {
                text-shadow: .25em 0 0 white, .5em 0 0 rgba(255,255,255,0), .75em 0 0 rgba(255,255,255,0);
            }
            80%, 100% {
                text-shadow: .25em 0 0 white, .5em 0 0 white, .75em 0 0 white;
            }
        }

        .progress-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35 0%, #ffd700 50%, #ff6b35 100%);
            border-radius: 3px;
            animation: progress 4s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        @keyframes progress {
            0% { width: 0%; }
            25% { width: 25%; }
            50% { width: 50%; }
            75% { width: 75%; }
            100% { width: 100%; }
        }

        .destination-labels {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50px;
            left: 50px;
        }

        .destination {
            position: absolute;
            color: #ffd700;
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            animation: fadeInOut 4s ease-in-out infinite;
        }

        .dest-1 { top: 50px; left: 140px; animation-delay: 0s; }
        .dest-2 { top: 100px; left: 250px; animation-delay: 1s; }
        .dest-3 { top: 200px; left: 280px; animation-delay: 2s; }
        .dest-4 { top: 250px; left: 140px; animation-delay: 3s; }

        @keyframes fadeInOut {
            0%, 90%, 100% { opacity: 0; transform: scale(0.8); }
            10%, 80% { opacity: 1; transform: scale(1); }
        }

        .clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 5;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            opacity: 0.7;
            animation: float 8s ease-in-out infinite;
        }

        .cloud:before {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
        }

        .cloud:after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
        }

        .cloud1 {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1:after {
            width: 60px;
            height: 60px;
            top: -25px;
            right: 10px;
        }

        .cloud2 {
            width: 60px;
            height: 60px;
            top: 70%;
            right: 20%;
            animation-delay: 2s;
        }

        .cloud2:before {
            width: 40px;
            height: 40px;
            top: -15px;
            left: 10px;
        }

        .cloud2:after {
            width: 50px;
            height: 50px;
            top: -20px;
            right: 15px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-10px) rotate(1deg); }
            66% { transform: translateY(-5px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>
    
    <div class="container">
        <div class="globe">
            <div class="india-marker"></div>
        </div>
        
        <div class="flight-path">
            <div class="plane"></div>
        </div>
        
        <div class="destination-labels">
            <div class="destination dest-1">EUROPE</div>
            <div class="destination dest-2">ASIA</div>
            <div class="destination dest-3">AUSTRALIA</div>
            <div class="destination dest-4">AFRICA</div>
        </div>
    </div>
    
    <div class="loading-text">
        Voyager.ai Journey Around the Globe<span class="dots">...</span>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>

    <script>
        // Enhanced animations and interactions
        document.addEventListener('DOMContentLoaded', function() {
            const plane = document.querySelector('.plane');
            const globe = document.querySelector('.globe');
            const progressFill = document.querySelector('.progress-fill');
            
            // Add dynamic flight sounds effect (visual representation)
            function createSparkle() {
                const sparkle = document.createElement('div');
                sparkle.style.cssText = `
                    position: absolute;
                    width: 4px;
                    height: 4px;
                    background: #ffd700;
                    border-radius: 50%;
                    pointer-events: none;
                    animation: sparkleAnimation 1s ease-out forwards;
                    z-index: 15;
                `;
                
                const rect = plane.getBoundingClientRect();
                const containerRect = document.querySelector('.container').getBoundingClientRect();
                
                sparkle.style.left = (rect.left - containerRect.left + 15) + 'px';
                sparkle.style.top = (rect.top - containerRect.top + 15) + 'px';
                
                document.querySelector('.container').appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1000);
            }
            
            // Add sparkle effect style
            const sparkleStyle = document.createElement('style');
            sparkleStyle.textContent = `
                @keyframes sparkleAnimation {
                    0% {
                        transform: scale(1) rotate(0deg);
                        opacity: 1;
                    }
                    100% {
                        transform: scale(0) rotate(180deg);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(sparkleStyle);
            
            // Create sparkles periodically
            setInterval(createSparkle, 500);
            
            // Dynamic loading messages
            const messages = [
                "Voyager.ai Journey Around the Globe",
                "Exploring New Destinations",
                "Connecting Cultures Worldwide",
                "Adventure Awaits",
                "Ready for Takeoff"
            ];
            
            const loadingText = document.querySelector('.loading-text');
            let messageIndex = 0;
            
            setInterval(() => {
                messageIndex = (messageIndex + 1) % messages.length;
                const textPart = loadingText.childNodes[0];
                textPart.textContent = messages[messageIndex];
            }, 4000);
            
            // Add interactive hover effects
            globe.addEventListener('mouseenter', function() {
                this.style.animationDuration = '5s';
            });
            
            globe.addEventListener('mouseleave', function() {
                this.style.animationDuration = '10s';
            });
            
            // Simulate completion after some time
            setTimeout(() => {
                document.body.style.transition = 'opacity 1s ease-out';
                // document.body.style.opacity = '0';
                // You can redirect or show completion here
            }, 16000);
        });
    </script>
</body>
</html>
