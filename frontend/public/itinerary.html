<body class="min-h-full bg-[radial-gradient(1200px_800px_at_10%_10%,rgba(0,0,0,0.03),transparent_60%),radial-gradient(900px_700px_at_80%_20%,rgba(0,0,0,0.03),transparent_60%),linear-gradient(180deg,#f6f7fb, #eef1f6)] text-ink antialiased">
  <main class="mx-auto max-w-4xl px-4 py-8">
    <header id="header" class="mb-6">
      <h1 id="title" class="text-2xl font-extrabold tracking-tight text-gray-900"></h1>
      <p id="tagline" class="mt-2 text-gray-700"></p>
      <section id="overview" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3"></section>
    </header>

    <section id="view-toggle" class="mb-3 flex items-center gap-2">
      <button id="btn-accordion" class="rounded-md border border-black/10 bg-white/70 px-3 py-1 text-sm font-medium">Accordion</button>
      <button id="btn-results" class="rounded-md border border-black/10 bg-white/50 px-3 py-1 text-sm">Results</button>
      <button id="btn-copy" class="ml-auto rounded-md border border-black/10 bg-white/70 px-3 py-1 text-sm">Copy Markdown</button>
    </section>
    <section id="accordion" class="space-y-3"></section>
    <section id="results" class="hidden"></section>
  </main>

  <!-- Embed the sample Markdown input (can be replaced dynamically) -->
  <script type="text/plain" id="md">
# Your Hyper-Detailed Itinerary: Sankeshwar, India

This itinerary explores the historical and cultural richness of Sankeshwar, offering a deeply immersive solo journey.

*   **Travel Dates:** 2025-01-01 to 2025-01-07
*   **Focus:** History & Museums
*   **Pace:** Balanced
*   **Budget:** Mid-Range

### Part 1: Sankeshwar, India (7 Days)

*A spiritual town renowned for its ancient temples and historical significance.*

#### Day 1: Arrival and Temple Exploration (2025-01-01)

**Morning:**

*   Arrive at Belgaum Airport (IXG) and take a pre-booked taxi to Sankeshwar (approx. 1.5 hours, ₹1500-₹2000). Alternatively, take a bus from Belgaum bus stand to Sankeshwar (approx. 2 hours, ₹100-₹150).
*   Check into your pre-booked accommodation. Consider **Hotel Shri Datta Residency** or **Hotel Surya**.
*   After settling in, visit the **Shri Shankarling Temple**, the main attraction of Sankeshwar. This temple is dedicated to Lord Shiva and known for its intricate carvings and peaceful atmosphere. Spend approximately 2-3 hours here.

**Afternoon:**

*   Lunch at **Hotel Ambika**, a local restaurant near the temple. Cuisine: South Indian. Budget: ₹150-₹250 per person. Try the local Thali.
*   Visit the **Mahalakshmi Temple**. This temple, though smaller than the Shankarling Temple, is equally significant and offers a glimpse into the local religious practices.
*   **Hidden Gem:** Ask the locals for the story behind the small shrine dedicated to Lord Hanuman near the Mahalakshmi Temple. It's believed to have protective powers.

**Evening:**

*   Attend the evening Aarti (prayer ceremony) at **Shri Shankarling Temple** (around 7:00 PM). Experience the spiritual ambiance.
*   Dinner at **Hotel Shivraj**, known for its North Indian cuisine. Cuisine: North Indian. Budget: ₹200-₹350 per person. Try the Butter Chicken.
*   **Contingency (Rainy Day):** Spend extra time exploring the interiors of Shri Shankarling Temple and engage in conversation with the temple priests to learn more about its history.

#### Day 2: Forts and Historical Sites (2025-01-02)

**Morning:**

*   Hire a local auto-rickshaw for the day (₹500-₹800) to explore surrounding historical sites.
*   Visit **Kittur Fort**, located approximately 45 km from Sankeshwar. This fort is historically significant as it was ruled by Rani Chennamma, a prominent figure in India's struggle for independence.
*   **Actionable Tip:** Allow at least 3 hours to explore the fort thoroughly. Carry water and snacks as facilities are limited.

**Afternoon:**

*   Have lunch at a local Dhaba (roadside eatery) near Kittur Fort. Cuisine: Simple local food. Budget: ₹100-₹200 per person.
*   Visit the **Kittur Rani Chennamma Memorial Museum**, showcasing artifacts related to Rani Chennamma and the Kittur kingdom.

**Evening:**

*   Return to Sankeshwar.
*   Visit the local market near the bus stand to experience the local culture and buy souvenirs.
*   Dinner at **Hotel Sai Prasad**, known for its vegetarian dishes. Cuisine: Vegetarian. Budget: ₹150-₹250 per person.
*   **Alternative Dinner:** Try street food near the market for a more authentic and budget-friendly experience.
*   **Bad Weather Plan B:** If the weather prevents visiting Kittur Fort, explore the local craft shops and textile centers in Sankeshwar known for their handloom sarees.

#### Day 3: Rural Immersion and Local Culture (2025-01-03)

**Morning:**

*   Take a bus or hire an auto-rickshaw to a nearby village (e.g., Mamdapur) to experience rural life. (Bus: ₹30-₹50, Auto: ₹200-₹300).
*   **Actionable Tip:** Dress respectfully when visiting rural areas.
*   Interact with the locals, visit a local farm, and learn about traditional agricultural practices.

**Afternoon:**

*   Have lunch at a local villager's home (arrange in advance through your hotel or a local contact). Cuisine: Authentic local cuisine. Budget: ₹200-₹300 per person. This provides a unique cultural immersion.
*   Visit the village temple or attend a local festival if available.

**Evening:**

*   Return to Sankeshwar.
*   Attend a local cultural performance if available (check with your hotel or local tourist information).
*  
*   **Hidden Gem:** Find a local tea stall and try "Masala Chai" made the traditional way.

#### Day 4: Ancient Jain Temple and Serenity (2025-01-04)

**Morning:**

*   Visit the **Jain Basadi**, an ancient Jain temple located a short distance from Sankeshwar (Hire an auto-rickshaw: ₹200-₹300 round trip).
*   Explore the temple's intricate architecture and learn about Jainism.

**Afternoon:**

*   Have lunch at a local restaurant near the Jain Basadi. Cuisine: South Indian. Budget: ₹150-₹250 per person.
*   Visit a nearby reservoir or dam for a peaceful afternoon. Enjoy the scenic views and serene atmosphere.

**Evening:**

*   Return to Sankeshwar.
*   Relax and unwind. Consider getting a massage at a local Ayurvedic center.
*   Dinner at **Hotel Anmol**, known for its vegetarian Budget: ₹200-₹350 per person.
*   **Alternative Dinner:** Explore other local eateries for a variety of culinary experiences.

#### Day 5: Pilgrimage to Amboli Ghat (2025-01-05)

**Morning:**

*   Take an early morning bus to Amboli Ghat, a scenic hill station located about 60 km from Sankeshwar (approx. 2 hours, ₹100-₹150).
*   Visit the **Hiranyakeshi Temple**, the origin of the Hiranyakeshi River, considered sacred by many.

**Afternoon:**

*   Explore other viewpoints in Amboli Ghat, such as **Sunset Point** and **Kavlesad Point**, known for their breathtaking views.
*   Have lunch at a local restaurant in Amboli Ghat. Cuisine: Maharashtrian. Budget: ₹200-₹350 per person.

**Evening:**

*   Return to Sankeshwar.
*   Dinner at **Hotel New Sagar**, another popular choice for seafood. Cuisine: Seafood. Budget: ₹250-₹400 per person.
*   **Contingency (Rainy Day):** Spend more time exploring the Hiranyakeshi Temple or visit a local spice garden in Amboli Ghat.

#### Day 6: Relaxation and Reflection (2025-01-06)

**Morning:**

*   Sleep in and have a leisurely breakfast at your hotel or a local cafe.
*   Visit a local park or garden for a relaxing morning.
*   **Hidden Gem:** Find a quiet spot by the river and meditate or journal.

**Afternoon:**

*   Revisit your favorite temple or historical site from the past few days.
*   Do some souvenir shopping for friends and family.

**Evening:**

*   Enjoy a farewell dinner at **Hotel Presidency**, considered one of the best restaurants in Sankeshwar. Cuisine: Multi-cuisine. Budget: ₹300-₹500 per person.
*   Reflect on your journey and the experiences you've had.

#### Day 7: Departure (2025-01-07)

**Morning:**

*   Enjoy a final breakfast in Sankeshwar.
*   Check out of your hotel.
*   Take a taxi or bus back to Belgaum Airport (IXG) for your departure.
*   **Actionable Tip:** Allow ample time for travel to the airport, considering potential traffic delays.

### Practical Notes (Tickets, Passes, and Money-Savers)

*   **Transportation:** Local buses are the most economical option for travel between towns. Auto-rickshaws are convenient for shorter distances within Sankeshwar. Consider hiring an auto-rickshaw for a full day of sightseeing.
*   **Accommodation:** Pre-book your accommodation, especially if traveling during peak season. Look for guesthouses or smaller hotels for a more budget-friendly option.
*   **Food:** Local eateries (dhabas) offer affordable and authentic meals. Be adventurous and try different local dishes.
*   **Bargaining:** Bargaining is common in local markets. Don't hesitate to negotiate prices, especially for souvenirs.
*   **Dress Code:** Dress modestly when visiting temples and rural areas.
*   **Currency:** Indian Rupees (INR) is the local currency. Ensure you have enough cash, as credit card acceptance may be limited in some places.

  <script>
    // Utility: simple markdown-ish parser tailored to the provided structure
    function parseMarkdown(md) {
      const lines = md.split(/\r?\n/);
      const data = { title: '', tagline: '', overview: {}, days: [] };
      // Title
      const titleLine = lines.find(l => l.trim().startsWith('# '));
      data.title = titleLine ? titleLine.replace(/^#\s+/, '').trim() : 'Your Itinerary';
      // Tagline: the first non-empty line after title that's not a list or heading
      let titleIdx = lines.findIndex(l => l.trim().startsWith('# '));
      let i = titleIdx + 1;
      while (i < lines.length && !lines[i].trim()) i++;
      if (i < lines.length && !lines[i].trim().startsWith('*') && !lines[i].trim().startsWith('###')) {
        data.tagline = lines[i].trim();
      }
      // Overview bullets: look for bold label **X:** value
      for (const line of lines) {
        const m = line.match(/\*\s*\*\*(.+?):\*\*\s*(.+)$/);
        if (m) data.overview[m[1].trim()] = m[2].trim();
      }
      // Days
      const dayIdxs = [];
      lines.forEach((l, idx) => { if (l.trim().startsWith('#### Day ')) dayIdxs.push(idx); });
      for (let d = 0; d < dayIdxs.length; d++) {
        const start = dayIdxs[d];
        const end = d + 1 < dayIdxs.length ? dayIdxs[d + 1] : lines.length;
        const header = lines[start].trim();
        const m = header.match(/^####\s+Day\s+(\d+):\s+(.+)\s+\((\d{4}-\d{2}-\d{2})\)\s*$/);
        const day = { number: d + 1, theme: '', date: '', morning: [], afternoon: [], evening: [] };
        if (m) { day.number = parseInt(m[1], 10); day.theme = m[2]; day.date = m[3]; }
        // sections
        let sec = '';
        for (let j = start + 1; j < end; j++) {
          const t = lines[j].trim();
          if (/^\*\*Morning:\*\*/i.test(t)) { sec = 'morning'; continue; }
          if (/^\*\*Afternoon:\*\*/i.test(t)) { sec = 'afternoon'; continue; }
          if (/^\*\*Evening:\*\*/i.test(t)) { sec = 'evening'; continue; }
          if (t.startsWith('*')) {
            const text = t.replace(/^\*\s*/, '');
            if (sec) day[sec].push(text);
          }
        }
        data.days.push(day);
      }
      return data;
    }

    function iconFor(text) {
      const t = text.toLowerCase();
      if (t.includes('cuisine') || t.includes('restaurant') || t.includes('dinner') || t.includes('lunch') || t.includes('breakfast')) return '🍴';
      if (t.includes('taxi') || t.includes('bus') || t.includes('train') || t.includes('metro') || t.includes('rickshaw')) return '🚗';
      if (t.includes('hidden gem') || t.includes('tip') || t.includes('insider')) return '💡';
      if (t.includes('temple') || t.includes('museum') || t.includes('fort') || t.includes('landmark')) return '🏛️';
      if (t.includes('contingency') || t.includes('bad weather')) return '⛈️';
      return '•';
    }

    function createDayItem(day, isOpen) {
      const wrap = document.createElement('div');
      wrap.className = 'accordion overflow-hidden rounded-xl bg-white shadow-card border border-black/5';
      if (isOpen) wrap.classList.add('open');

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'w-full flex items-center justify-between gap-3 px-4 py-3 text-left bg-white hover:bg-gray-50 transition-colors';
      btn.innerHTML = `
        <div class="min-w-0">
          <div class="text-sm font-semibold text-gray-900 truncate">Day ${day.number}: ${day.theme} <span class="text-gray-500">(${day.date})</span></div>
        </div>
        <div class="shrink-0 transition-transform duration-300 chevron ${isOpen ? 'rotate-180' : ''}">▾</div>
      `;

      const content = document.createElement('div');
      content.className = 'accordion-content bg-white/70';

      const inner = document.createElement('div');
      inner.className = 'p-4 grid gap-4';

      function section(title, items) {
        const card = document.createElement('div');
        card.className = 'rounded-lg border border-black/5 bg-subtle p-3';
        const h = document.createElement('div');
        h.className = 'text-[13px] font-semibold text-gray-800 mb-1';
        h.textContent = title;
        const ul = document.createElement('ul');
        ul.className = 'prose';
        items.forEach(raw => {
          const li = document.createElement('li');
          const marker = iconFor(raw);
          li.innerHTML = `<span class="mr-1">${marker}</span>${raw}`;
          ul.appendChild(li);
        });
        card.appendChild(h);
        card.appendChild(ul);
        return card;
      }

      if (day.morning.length) inner.appendChild(section('Morning', day.morning));
      if (day.afternoon.length) inner.appendChild(section('Afternoon', day.afternoon));
      if (day.evening.length) inner.appendChild(section('Evening', day.evening));

      content.appendChild(inner);

      btn.addEventListener('click', () => {
        const open = wrap.classList.toggle('open');
        const chev = btn.querySelector('.chevron');
        if (chev) chev.classList.toggle('rotate-180', open);
        if (open) {
          content.style.maxHeight = inner.scrollHeight + 'px';
        } else {
          content.style.maxHeight = '0px';
        }
      });

      wrap.appendChild(btn);
      wrap.appendChild(content);

      // Initialize height if open
      setTimeout(() => { if (isOpen) content.style.maxHeight = inner.scrollHeight + 'px'; }, 0);
      return wrap;
    }

  function renderAccordion(data) {
      document.getElementById('title').textContent = data.title;
      document.getElementById('tagline').textContent = data.tagline || '';

      const overview = document.getElementById('overview');
      overview.innerHTML = '';
      const keys = ['Travel Dates', 'Focus', 'Pace', 'Budget'];
      keys.forEach(k => {
        if (data.overview[k]) {
          const card = document.createElement('div');
          card.className = 'rounded-lg border border-black/5 bg-white/70 shadow-card p-3';
          card.innerHTML = `<div class="text-xs uppercase tracking-wide text-gray-500">${k}</div><div class="text-sm font-medium text-gray-900">${data.overview[k]}</div>`;
          overview.appendChild(card);
        }
      });

      const acc = document.getElementById('accordion');
      acc.innerHTML = '';
      data.days.forEach((day, idx) => acc.appendChild(createDayItem(day, idx === 0)));
    }

    function chip(text) {
      const span = document.createElement('span');
      span.className = 'rounded-md border border-black/10 bg-white/70 px-2 py-0.5 text-xs text-gray-900';
      span.textContent = text;
      return span;
    }

    function extractMeta(text) {
      const mTime = (text.match(/(\b\d{1,2}:\d{2}\s?(?:AM|PM)?)/i) || [])[1] || null;
      const mDur = (text.match(/\b((?:\d+\s*hr\s*)?\d+\s*min)\b/i) || [])[1] || null;
      const mDist = (text.match(/\b(\d+(?:\.\d+)?)\s*(km|mi)\b/i) || []);
      const distance = mDist[1] ? (mDist[1] + ' ' + mDist[2]) : null;
      const strong = (text.match(/\*\*(.+?)\*\*/) || [])[1] || null;
      return { time: mTime, duration: mDur, distance, strong };
    }

    function renderResults(data) {
      const results = document.getElementById('results');
      results.innerHTML = '';
      const header = document.createElement('div');
      header.className = 'mb-4 flex items-center justify-between';
      const dest = (data.title.match(/Itinerary:\s*(.+)$/i) || [])[1] || 'Trip';
      header.innerHTML = `<div class="text-lg font-bold">Trip to ${dest} <span class="text-gray-500">(v1)</span></div>
      <div class="flex items-center gap-2">
        <button class="rounded-full bg-yellow-400/90 text-black text-xs px-3 py-1 font-semibold">Shortlisted Hotels →</button>
        <button class="rounded-full bg-white/70 border border-black/10 text-xs px-3 py-1">Map View ⤢</button>
      </div>`;
      results.appendChild(header);

      const tabs = document.createElement('div');
      tabs.className = 'mb-3 flex flex-wrap gap-2';
      const list = document.createElement('div');
      list.className = 'space-y-3';
      let current = 0;
      function setDay(i) {
        current = i; list.innerHTML='';
        const day = data.days[i] || data.days[0];
        const items = [].concat(day.morning.map(x=>({section:'Morning',text:x})), day.afternoon.map(x=>({section:'Afternoon',text:x})), day.evening.map(x=>({section:'Evening',text:x})));
        items.forEach(it => {
          const meta = extractMeta(it.text);
          const card = document.createElement('div');
          card.className = 'rounded-xl border border-black/10 bg-white/80 p-3 shadow-card';
          const icon = iconFor(it.text);
          const title = meta.strong || it.text.replace(/\*\*|__/g,'').slice(0,80);
          const top = document.createElement('div');
          top.className = 'flex items-center gap-3';
          top.innerHTML = `<div class="grid h-8 w-8 place-items-center rounded-full bg-black/5 text-lg">${icon}</div>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-semibold text-gray-900 truncate">${title}</div>
              <div class="text-xs text-gray-700">${it.text.replace(/\*\*(.+?)\*\*/g, '$1')}</div>
            </div>`;
          const chips = document.createElement('div'); chips.className = 'flex items-center gap-1';
          if (meta.time) chips.appendChild(chip(meta.time));
          if (meta.duration) chips.appendChild(chip(meta.duration));
          if (meta.distance) chips.appendChild(chip(meta.distance));
          top.appendChild(chips);
          card.appendChild(top);
          const sec = document.createElement('div'); sec.className = 'mt-2 text-xs text-gray-600'; sec.textContent = it.section; card.appendChild(sec);
          list.appendChild(card);
        });
      }
      data.days.forEach((d,i)=>{
        const b = document.createElement('button');
        b.className = 'rounded-full px-3 py-1 text-xs border border-black/10 bg-white/70';
        b.textContent = 'Day '+d.number; b.addEventListener('click',()=>setDay(i));
        tabs.appendChild(b);
      });
      results.appendChild(tabs);
      results.appendChild(list);
      setDay(0);
    }

    (function init() {
      let md = '';
      try { md = localStorage.getItem('voyager_last_itinerary_md') || ''; } catch {}
      if (!md) {
        md = document.getElementById('md').textContent;
      }
      const data = parseMarkdown(md);
      const params = new URLSearchParams(location.search);
      const initial = params.get('view') === 'results' ? 'results' : 'accordion';
      const btnA = document.getElementById('btn-accordion');
      const btnR = document.getElementById('btn-results');
      const btnC = document.getElementById('btn-copy');
      const acc = document.getElementById('accordion');
      const res = document.getElementById('results');
      function show(v){
        if(v==='results'){ res.classList.remove('hidden'); acc.classList.add('hidden'); btnR.classList.add('font-medium'); btnA.classList.remove('font-medium'); renderResults(data); }
        else { acc.classList.remove('hidden'); res.classList.add('hidden'); btnA.classList.add('font-medium'); btnR.classList.remove('font-medium'); renderAccordion(data); }
      }
      btnA.addEventListener('click',()=>show('accordion'));
      btnR.addEventListener('click',()=>show('results'));
      btnC.addEventListener('click',()=>{ try{navigator.clipboard.writeText(md);}catch{}});
      show(initial);
    })();
  </script>
