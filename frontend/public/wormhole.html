<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voyager - Wormhole Transition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
          canvas {
        display: block;
      }
      
      .fade-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        z-index: 100;
        opacity: 0;
        transition: opacity 1s ease-in-out;
        pointer-events: none;
      }
      
      .fade-overlay.active {
        opacity: 1;
      }
  </style>
</head>
<body>
  <canvas id="wormhole-canvas"></canvas>
  
  <!-- Fade Overlay -->
  <div class="fade-overlay" id="fadeOverlay"></div>

  <!-- Vertex Shader -->
  <script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  </script>

  <!-- Fragment Shader -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    varying vec2 vUv;
    uniform float uTime;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 0.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy,h.x);
      vec3 p1 = vec3(a0.zw,h.y);
      vec3 p2 = vec3(a1.xy,h.z);
      vec3 p3 = vec3(a1.zw,h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    float fbm(vec3 p) {
      float value = 0.0;
      float amplitude = 0.5;
      for (int i = 0; i < 6; i++) {
        value += amplitude * snoise(p);
        p *= 2.0;
        amplitude *= 0.5;
      }
      return value;
    }

    void main() {
      vec2 uv = vUv;
      float speed = 0.2;
      vec3 color = vec3(0.0);

      float noise1 = fbm(vec3(uv * 1.5, uTime * speed * 0.5));
      vec3 color1 = vec3(0.0, 0.1, 0.2);
      color = mix(color, color1, smoothstep(0.3, 0.6, noise1));

      float noise2 = fbm(vec3(uv.x * 2.0, uv.y * 4.0 + uTime * speed * 2.0, uTime * 0.1));
      vec3 color2 = vec3(0.1, 0.5, 0.8);
      color = mix(color, color2, smoothstep(0.5, 0.7, noise2));

      float noise3 = fbm(vec3(uv * 3.0, uTime * speed * 1.5));
      vec3 color3 = vec3(0.8, 0.2, 0.5);
      color += color3 * pow(noise3, 3.0);

      float core = 1.0 - distance(uv, vec2(0.5));
      core = pow(core, 4.0);
      color += vec3(core * 1.5);

      color = pow(color, vec3(1.2));
      gl_FragColor = vec4(color, 1.0);
    }
  </script>

  <script>
    const wormholeCanvas = document.getElementById('wormhole-canvas');
    const fadeOverlay = document.getElementById('fadeOverlay');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ canvas: wormholeCanvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Double the tunnel length
    class CustomCurve extends THREE.Curve {
      constructor(scale = 2400) { super(); this.scale = scale; }
      getPoint(t) {
        const tx = Math.sin(t * Math.PI * 2.5) * 15;
        const ty = Math.cos(t * Math.PI * 1.5) * 15;
        const tz = t * this.scale * -1;
        return new THREE.Vector3(tx, ty, tz);
      }
    }

    const path = new CustomCurve(2400);
    const geometry = new THREE.TubeGeometry(path, 400, 30, 16, false);
    const material = new THREE.ShaderMaterial({
      vertexShader: document.getElementById('vertexShader').textContent,
      fragmentShader: document.getElementById('fragmentShader').textContent,
      uniforms: { uTime: { value: 0 } },
      side: THREE.BackSide,
    });
    const wormhole = new THREE.Mesh(geometry, material);
    scene.add(wormhole);

    // Regular stars
    const starVertices = [];
    for (let i = 0; i < 1000; i++) {
      const x = (Math.random() - 0.5) * 200;
      const y = (Math.random() - 0.5) * 200;
      const z = (Math.random() - 0.5) * 2000;
      starVertices.push(x, y, z);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, opacity: 0.8, transparent: true });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Dense block of stars at tunnel exit
    const exitStars = [];
    for (let i = 0; i < 2000; i++) {
      const radius = 200 + Math.random() * 300;
      const angle = Math.random() * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      const z = -2400 - Math.random() * 300; // at end
      exitStars.push(x, y, z);
    }
    const exitStarGeometry = new THREE.BufferGeometry();
    exitStarGeometry.setAttribute('position', new THREE.Float32BufferAttribute(exitStars, 3));
    const exitStarMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, opacity: 1, transparent: true });
    const exitStarField = new THREE.Points(exitStarGeometry, exitStarMaterial);
    scene.add(exitStarField);

    const clock = new THREE.Clock();
    let progress = 0;
    const travelSpeed = 0.25; // normal ~0.05 → now 5x faster

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      material.uniforms.uTime.value += delta;

      progress += delta * travelSpeed;
      if (progress > 1) progress = 1; // stop at end

      const point = path.getPointAt(progress);
      const tangent = path.getTangentAt(progress);

      camera.position.copy(point);
      camera.lookAt(point.clone().add(tangent));

      // Start fade out just before completion (at 90% progress)
      if (progress > 0.9 && !isTransitioning) {
        startTransition();
      }

      renderer.render(scene, camera);
    }

    let isTransitioning = false;

    function startTransition() {
      isTransitioning = true;
      
      // Start fade out just before completion
      fadeOverlay.classList.add('active');
      
      // Wait for fade to complete, then transition
      setTimeout(() => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'WORMHOLE_COMPLETE' }, '*');
        } else {
          // Fallback for direct access
          window.location.href = '/?view=chatbox';
        }
      }, 1000);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
