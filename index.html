<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyegar.ai - AI-Powered Travel Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Typing Animation Container -->
        <div class="typing-container" id="typingContainer">
            <h1 class="brand-text" id="brandText">
                <span class="letter" data-letter="V">V</span>
                <span class="letter" data-letter="o">o</span>
                <span class="letter" data-letter="y">y</span>
                <span class="letter" data-letter="e">e</span>
                <span class="letter" data-letter="g">g</span>
                <span class="letter" data-letter="a">a</span>
                <span class="letter" data-letter="r">r</span>
                <span class="letter" data-letter=".">.ai</span>
            </h1>
            <div class="cursor" id="cursor">|</div>
        </div>

        <!-- Globe and Airplane Container -->
        <div class="globe-container" id="globeContainer">
            <div class="globe" id="globe">
                <div class="globe-surface">
                    <div class="continent continent-1"></div>
                    <div class="continent continent-2"></div>
                    <div class="continent continent-3"></div>
                    <div class="continent continent-4"></div>
                    <div class="continent continent-5"></div>
                    <div class="continent continent-6"></div>
                </div>
                <div class="globe-shine"></div>
            </div>
            
            <!-- Airplane -->
            <div class="airplane" id="airplane">
                <svg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Airplane body -->
                    <path d="M50 20 L50 80 L45 75 L45 25 Z" fill="#2563eb" opacity="0"/>
                    <!-- Wings -->
                    <path d="M30 45 L70 45 L65 50 L35 50 Z" fill="#1d4ed8" opacity="0"/>
                    <!-- Tail -->
                    <path d="M45 75 L55 75 L50 85 Z" fill="#1e40af" opacity="0"/>
                </svg>
                
                <!-- Trail effect -->
                <div class="trail" id="trail"></div>
            </div>
        </div>

        <!-- Final logo state -->
        <div class="final-logo" id="finalLogo">
            <h1>Voyegar.ai</h1>
            <p class="tagline">AI-Powered Travel Intelligence</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
